[project]
name = "tabayyun"
version = "0.1.0"
description = "تبيّن — التحقق من صحة النصوص الشرعية ونسبتها (Tabayyun: verification of Islamic text authenticity and attribution)"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "python-dotenv>=1.0",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
  "rapidfuzz>=3.9",
  "numpy>=1.26",
  "trafilatura>=1.12",
  "beautifulsoup4>=4.12",
  "lxml>=5.2",
  "yt-dlp>=2025.1.1",
  "imageio-ffmpeg>=0.5",
  "pillow>=11.0",
  "segno>=1.6",
  "anthropic>=0.40",
  "openai>=1.50",
]

[project.optional-dependencies]
# Local multilingual embeddings for semantic hadith retrieval (ONNX, CPU).
embeddings = ["fastembed>=0.4"]
# Local speech-to-text fallback (used when no cloud transcription key is configured).
whisper = ["faster-whisper>=1.0"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "matplotlib>=3.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tabayyun"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "network: test needs live network access to an approved source",
  "llm: test needs a configured LLM provider key",
]
