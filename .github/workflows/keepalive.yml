# Pings the deployed instance every 10 minutes so a free-tier host does not go idle during judging.
# Set the repository variable TABAYYUN_URL (Settings → Secrets and variables → Actions → Variables)
# to the public base URL, e.g. https://tabayyun.onrender.com
name: keep-alive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    if: ${{ vars.TABAYYUN_URL != '' }}
    steps:
      - name: GET /health
        run: |
          code=$(curl -sS -o /tmp/health.json -w '%{http_code}' --max-time 60 "${{ vars.TABAYYUN_URL }}/health")
          echo "HTTP $code"; cat /tmp/health.json; echo
          test "$code" = "200"
