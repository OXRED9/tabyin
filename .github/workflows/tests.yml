name: tests

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e './backend[dev]'
      - name: Data (Quran from the repo, HadeethEnc API, Open-Hadith-Data)
        run: python scripts/bootstrap_data.py
      - name: Unit and integration tests (no LLM key, no live-network tests)
        run: cd backend && pytest -q -m "not network and not llm"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Lint, type-check and build
        run: npm run lint && npm run build
