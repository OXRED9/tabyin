<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1b6b5e" />
    <meta name="color-scheme" content="light dark" />
    <meta name="referrer" content="no-referrer" />
    <meta
      name="description"
      content="تبيّن: أداة تتحقق من الآيات والأحاديث والأقوال المنسوبة داخل أي محتوى، وتعرض مصدر كل استشهاد وحالته."
    />
    <title>تبيّن — تحقّق قبل أن تصدّق أو تنشر</title>
    <script>
      // Apply the saved theme before first paint, so dark mode never flashes light.
      try {
        var q = new URLSearchParams(location.search).get('theme')
        var s = JSON.parse(localStorage.getItem('tabayyun.theme') || 'null')
        var t = q || s || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
        if (t === 'dark') document.documentElement.classList.add('dark')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
