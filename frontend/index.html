<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- The web app manifest (/manifest.webmanifest) and the home-screen icon are linked by
         src/lib/pwa.ts once the page has loaded: they serve installing, not this first paint. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="color-scheme" content="light dark" />
    <meta name="referrer" content="no-referrer" />
    <meta
      name="description"
      content="تبيّن: أداة تتحقق من الآيات والأحاديث والأقوال المنسوبة داخل أي محتوى، وتعرض مصدر كل استشهاد وحالته."
    />
    <title>تبيّن — تحقّق قبل أن تصدّق أو تنشر</title>
    <script>
      // Before the first paint: the saved theme (so dark never flashes light), the saved language
      // (so the shell below is in it), and which first screen the shell stands for.
      try {
        var q = new URLSearchParams(location.search)
        var d = document.documentElement
        var t = q.get('theme') || JSON.parse(localStorage.getItem('tabayyun.theme') || 'null')
        t = t || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
        if (t === 'dark') {
          d.classList.add('dark')
          document.querySelector('meta[name="theme-color"]').content = '#10231e'
        }
        var l = q.get('lang')
        if (l !== 'ar' && l !== 'en') l = JSON.parse(localStorage.getItem('tabayyun.lang') || 'null')
        if (l === 'en') {
          d.lang = 'en'
          d.dir = 'ltr'
          document.title = 'Tabayyun — verify before you believe or share'
        }
        // Mock mode's direct route to a report starts on the report's sheet, not on the composer.
        if (q.has('mock') && q.get('autorun') === '1') d.dataset.view = 'report'
      } catch (e) {}
    </script>
    <!-- The stylesheet is linked here, not imported by the script: the shell below is styled by it
         before any script has run. -->
    <link rel="stylesheet" href="/src/index.css" />
    <!-- The faces the first screen is set in, fetched with the page instead of after its styles. -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin
      href="/node_modules/@fontsource/ibm-plex-sans-arabic/files/ibm-plex-sans-arabic-arabic-400-normal.woff2"
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin
      href="/node_modules/@fontsource/ibm-plex-sans-arabic/files/ibm-plex-sans-arabic-arabic-600-normal.woff2"
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin
      href="/node_modules/@fontsource/ibm-plex-sans/files/ibm-plex-sans-latin-400-normal.woff2"
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin
      href="/node_modules/@fontsource/amiri/files/amiri-arabic-400-normal.woff2"
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin
      href="/node_modules/@fontsource/amiri/files/amiri-latin-400-normal.woff2"
    />
  </head>
  <body>
    <div id="root">
      <!--
        The static shell: the bar, the sheet and the headline, painted from this HTML and the
        stylesheet before any script runs. React's first render replaces it with the same
        thing, alive, so nothing flashes or moves. Keep its classes in step with
        src/components/app-header.tsx, src/App.tsx and src/components/composer.tsx.
      -->
      <div class="flex min-h-dvh flex-col">
        <header class="sticky top-0 z-40 border-b bg-paper">
          <div class="flex h-12 items-center gap-1 px-4 sm:gap-3 sm:px-6">
            <button type="button" tabindex="-1" class="flex items-center gap-2 rounded-control">
              <svg viewBox="0 0 32 32" aria-hidden="true" class="size-7 shrink-0">
                <rect width="32" height="32" rx="7" fill="var(--green-fill)" />
                <rect x="13" y="13" width="13" height="13" rx="4" fill="#ffffff" fill-opacity="0.18" stroke="#ffffff" stroke-opacity="0.7" stroke-width="2" />
                <rect x="6" y="6" width="14" height="14" rx="4.5" fill="var(--gold)" />
                <circle cx="13" cy="13" r="3.6" fill="var(--green-fill)" />
              </svg>
              <span class="naskh-display text-xl leading-none text-ink">
                <span data-shell-lang="ar">تبيّن</span>
                <span data-shell-lang="en">Tabayyun</span>
              </span>
            </button>
          </div>
        </header>
        <main class="flex-1 sm:px-4 sm:py-6 lg:py-10">
          <div
            data-shell="sheet"
            class="mx-auto flex w-full max-w-[45rem] flex-col border-b bg-paper p-5 sm:rounded-sheet sm:border md:p-8 lg:p-12"
          >
            <p data-shell="headline" class="naskh-display text-2xl text-balance text-ink md:text-3xl">
              <span data-shell-lang="ar">فتبيّنوا — تحقّق قبل أن تصدّق أو تنشر</span>
              <span data-shell-lang="en">Verify before you believe or share</span>
            </p>
          </div>
        </main>
      </div>
    </div>
    <!-- The page above is readable without this; the code that makes it work comes after it. -->
    <script type="module" src="/src/main.tsx" fetchpriority="low"></script>
  </body>
</html>
